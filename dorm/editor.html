<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云图计划 · 宿舍 M2 摆放编辑器</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1612;
               font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  #app { position: absolute; inset: 0; }
  .panel { position: absolute; background: rgba(20,16,12,.85); color: #e8ddc8;
           border-radius: 8px; padding: 10px 12px; font-size: 12.5px; backdrop-filter: blur(4px); }
  #left { top: 12px; left: 12px; bottom: 12px; width: 210px; display: flex; flex-direction: column; }
  #left h1 { font-size: 14px; margin: 0 0 8px; color: #ffd98a; }
  #catalog { overflow: auto; flex: 1; }
  #catalog .theme { color: #f0b95e; margin: 8px 0 3px; font-weight: 600; }
  #catalog button { display: inline-block; margin: 0 3px 4px 0; padding: 3px 8px; border-radius: 4px;
                    border: 1px solid #6b5636; background: #33291c; color: #ffd98a; cursor: pointer; font-size: 12px; }
  #catalog button:hover { background: #4a3b26; }
  #right { top: 12px; right: 12px; width: 200px; }
  #right h1 { font-size: 13px; margin: 0 0 6px; color: #ffd98a; }
  #list { max-height: 240px; overflow: auto; }
  #list .it { padding: 2px 4px; cursor: pointer; border-radius: 3px; }
  #list .it:hover { background: #3a2f20; }
  #list .it span { color: #a99e8a; font-size: 11px; }
  #list .dim { color: #a99e8a; }
  #props { margin-top: 8px; display: none; border-top: 1px solid #4a3b26; padding-top: 8px; }
  #props button { margin: 3px 4px 0 0; padding: 3px 10px; border-radius: 4px; border: 1px solid #6b5636;
                  background: #33291c; color: #ffd98a; cursor: pointer; }
  #hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
          color: #ffd98a; background: rgba(20,16,12,.8); padding: 5px 14px; border-radius: 6px;
          font-size: 13px; display: none; }
  #hint:empty { display: none; }
  .keys { margin-top: 8px; color: #a99e8a; font-size: 11px; line-height: 1.6; }
  a { color: #f0b95e; }
</style>
</head>
<body>
<div id="app"></div>
<div id="left" class="panel">
  <h1>宿舍摆放编辑器 <a href="./index.html" style="float:right;font-size:11px">巡游页</a></h1>
  <div id="catalog"></div>
</div>
<div id="right" class="panel">
  <h1>已放置</h1>
  <div id="list"></div>
  <div id="props">
    <div><b id="pname"></b> · <span id="ppos"></span> · <span id="prot"></span></div>
    <button id="b-rot">旋转 (R)</button>
    <button id="b-del">删除 (Del)</button>
  </div>
  <div class="keys">
    目录点选 → 预览放置 · R 旋转 · 左键拖动已放置件 · Del 删除 · Esc 取消<br>
    布局自动存 IndexedDB(room1)
    <button id="b-import" style="margin-top:6px">导入实机房间</button>
    <button id="b-clear" style="margin-top:6px">清空房间</button>
    <div id="import-box" style="display:none;margin-top:6px">
      <select id="import-room" style="width:100%"></select>
      <button id="import-cancel" style="margin-top:4px">取消</button>
    </div>
  </div>
</div>
<div id="hint"></div>
<script>
  window.__errs = [];
  window.addEventListener('error', (e) => window.__errs.push((e.error && e.error.stack) || e.message));
  window.addEventListener('unhandledrejection', (e) => window.__errs.push('REJ ' + ((e.reason && e.reason.stack) || e.reason)));
</script>
<script type="module" src="./editor.js"></script>
</body>
</html>
