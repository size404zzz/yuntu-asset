<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>probe: 单镜渲染</title>
<link rel="stylesheet" href="/tools/ref/avg.css">
<style>
  html, body { margin: 0; background: #1b1b1b; overflow: hidden; }
  body { color: black; font-family: "Segoe UI", Lato, "Noto Sans", sans-serif; }
</style>
</head>
<body>
<div id="mount"></div>
<script type="module">
/* 一次性目视探针：装载指定剧本并停在指定键，供 tools/shot.mjs 截图。
   用法 /bundles/_probe/probe-shot.html?id=22child_02&key=44 */
import {Player} from '/js/engine/player.js';
import {parseChunk} from '/js/core/lundump.js';
import {execChunk, toJS} from '/js/core/lvm.js';
import {storyToWire} from '/js/core/avgwire.js';

import {loadRepoIndex, flatLookup} from '/js/core/repo-index.js';
import {deriveLayout} from '/js/engine/sprite.js';
import {VirtualTimer} from '/js/test/harness.js';

const URLP = new URLSearchParams(location.search);
const ID = URLP.get('id') || '22child_02';
const KEY = URLP.get('key') || '44';
const clock = new VirtualTimer();
const repo = await loadRepoIndex();
const manifest = await (await fetch('/data/index/avg-scripts.json')).json();
const meta = manifest.stories.find((s) => s.id === ID);
const decodeLua = async (path) => {
  const bytes = new Uint8Array(await (await fetch('/' + path)).arrayBuffer());
  return toJS(execChunk(parseChunk(bytes))[0]);
};
const {wire} = storyToWire(await decodeLua(meta.cfg), await decodeLua(meta.lang),
    {imgIds: manifest.imgIds, heroSprites: manifest.heroSprites, pathOwner: manifest.pathOwner});

const player = new Player({
  mount: document.getElementById('mount'),
  mode: 'clamp',
  timer: clock,
  filePathOf: (name) => flatLookup(repo, name) ?? '/images/' + name,
  layoutOf: async (img) => {
    try {
      return await (await fetch('/data/layouts/' + img.imgPath + '.json')).json();
    } catch { /* 无标定件，走 derive */ }
    const path = flatLookup(repo, 'lpic_' + img.imgPath + '.png');
    if (!path) throw new Error(`立绘缺 lpic：${img.imgPath}`);
    const blob = await (await fetch('/' + path)).blob();
    return deriveLayout(await createImageBitmap(blob));
  },
  getName: () => '教授',
  characters: await (await fetch('/data/Avg_character.json')).json(),
});
player.setScene(wire, ID, KEY, '', '');
await player.seekShot(Number(KEY));
await player.idle();
window.__probe = {
  charas: document.querySelectorAll('.avg-chara').length,
  paths: [...document.querySelectorAll('.avg-chara')].map((e) => ({
    src: (e.style.backgroundImage || '').slice(-40),
    opacity: getComputedStyle(e).opacity,
    filter: getComputedStyle(e).filter,
  })),
};
document.title = `PROBE ${ID}#${KEY} charas=${window.__probe.charas}`;
</script>
</body>
</html>
