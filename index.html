<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>云图计划 · 剧情播放器编辑器</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/avg.css">
<link rel="stylesheet" href="css/pandect.css">
<link rel="stylesheet" href="css/ux.css">
</head>
<body>
<div class="app">
  <div class="bar">
    <span class="title">AVG 剧情编辑器</span>
    <span id="story-label" class="muted"></span>
    <button id="btn-undo" class="tiny" disabled>撤销</button>
    <button id="btn-redo" class="tiny" disabled>重做</button>
    <span class="spacer"></span>
    <span id="storage" class="muted"></span>
    <button id="btn-assets" class="tiny">素材库</button>
    <button id="btn-storylib" class="tiny">剧本库</button>
    <button id="btn-fade" class="tiny">退场建议</button>
    <button id="btn-record" class="tiny">录制视频</button>
    <button id="btn-sound" class="tiny">音效·开</button>
    <button id="btn-save" class="tiny">保存</button>
    <button id="btn-import" class="tiny">导入</button>
    <button id="btn-export" class="tiny">导出JSON</button>
    <button id="btn-export-zip" class="tiny">导出ZIP</button>
  </div>
  <div class="cols">
    <div class="col col-a">
      <header>分镜</header>
      <div class="body" id="shot-list"></div>
    </div>
    <div class="col col-b">
      <header>检查器</header>
      <div class="body" id="inspector"><div class="report" id="report"></div></div>
    </div>
    <div class="col col-c">
      <header>预览</header>
      <div class="body preview-area">
        <div id="preview" style="width:100%"></div>
        <div class="transport">
          <button id="tp-prev" class="tiny">⏮</button>
          <button id="tp-play" class="tiny">▶ 连播</button>
          <button id="tp-next" class="tiny">⏭</button>
          <button id="tp-rate" class="tiny" title="10 倍速通读（CSS 过渡不吃这份钟）">1×</button>
          <select id="tp-mode" class="tiny">
            <option value="freeze">定格</option>
            <option value="once">播放本镜</option>
            <option value="chain">连续播放</option>
          </select>
          <span id="tp-pos" class="muted"></span>
        </div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
